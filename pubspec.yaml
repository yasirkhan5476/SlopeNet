name: slope_net
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_launcher_icons: ^0.14.4
  lottie: ^3.8.2
  get: ^4.7.3
  google_fonts: ^9.0.0
  mapbox_maps_flutter: ^3.35.0
  flutter_dotenv: ^6.0.2
  cloud_firestore: ^7.2.0
  firebase_auth: ^7.1.0
  firebase_core: ^5.2.0
  geolocator: ^14.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

# 1. flutter_launcher_icons configuration must be at the ROOT level
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/Icon/Slopenet2.png"
#  min_sdk_android: 24
#  windows:
#    generate: true
#    image_path: "assets/Icon/Slopenet.jpeg"
#    icon_size: 48
#  macos:
#    generate: true
#    image_path: "assets/Icon/Slopenet.jpeg"

flutter:
  uses-material-design: true

  # 2. Correctly indented asset path under assets:
  assets:
    - assets/Icon/
    - assets/animations/
    - assets/config.env